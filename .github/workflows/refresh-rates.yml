name: Refresh official rates

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read MTN and Airtel pages
        run: node scripts/refresh-rates.mjs
      - name: Rebuild pages
        run: node build.mjs
      - name: Commit tariff changes
        run: |
          git config user.name "rates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json *.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No rate changes to commit."
          else
            git commit -m "Update published MTN and Airtel mobile money rates"
            git push
          fi
